<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Book List</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='mybooklist.css') }}">
</head>
<body>
  <div id="sidebar">
    <div id="userIdDisplay">{{ user_id }}</div>
    <button class="btn" id="backToSearchBtn">Back to Search</button>
    <button class="btn" id="backBtn">Back to Main Page</button>
  </div>
  
  <div id="mainContainer">
    <h1>My Book Library</h1>
    
    <div id="paginationControls">
      <button id="prevPage">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextPage">Next</button>
    </div>

    <div id="bookListContainer">
      <div id="bookListHeader">
      </div>
      <div id="myBookListResults"></div>
    </div>

    <div id="recommendationSection">
  <button id="getRecommendationsBtn" class="recommend-btn">Get Recommendations</button>
  <div id="recommendationResults">
    <!-- Yükleme animasyonu -->
    <div id="loadingRing" class="loading-ring" style="display: none;">
      <div class="ring"></div>
      <p>loading...</p>
    </div>
    <!-- Öneriler buraya gelecek -->
  </div>
</div>

  <script src="{{ url_for('static', filename='mybooklist.js') }}"></script>
</body>
</html>
